name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # pandas 2.2 / pydantic 2.5 / pymc 5.10 n'ont pas de wheels pour 3.13
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test imports
        run: python -c "import streamlit, pandas, pymc"

      - name: Lint (flake8)
        run: python -m flake8 .

      - name: Run tests
        run: python -m pytest -q
