name: MMM Pipeline Orchestration

on:
  schedule:
    # Exécute chaque jour à 2h du matin UTC (3h été)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Permet de déclencher manuellement

jobs:
  mmm-pipeline:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check raw data availability
        id: data
        run: |
          if ls data/raw/*.csv >/dev/null 2>&1; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; echo "::warning::data/raw/ est absent (ignoré par git) : ETL et entraînement ignorés"; fi

      - name: Run ETL Pipeline
        if: steps.data.outputs.available == 'true'
        env:
          # Si vous avez des secrets BigQuery, les ajouter ici
          # GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          PYTHONUNBUFFERED: 1
        run: |
          echo "Starting ETL Pipeline..."
          python run_pipeline.py
          echo "ETL Pipeline completed successfully"
      
      - name: Run Tests
        run: |
          echo "Running test suite..."
          python -m pytest -v --tb=short
          echo "All tests passed!"
      
      - name: Train MMM Model
        if: steps.data.outputs.available == 'true'
        run: |
          echo "Training MMM model..."
          python scripts/train_model.py
          echo "Model training completed"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmm-artifacts
          path: models/artifacts/
          if-no-files-found: ignore
          retention-days: 30
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Pipeline failed!"
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "Artifacts available: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
