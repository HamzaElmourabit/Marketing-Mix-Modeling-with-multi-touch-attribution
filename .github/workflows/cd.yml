name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: |
          docker build -t mmm-project:${{ github.sha }} .

      - name: Smoke test image
        run: docker run --rm mmm-project:${{ github.sha }} python -c "import streamlit, pandas, pymc"

      - name: Docker Hub secrets missing (push skipped)
        if: startsWith(github.ref, 'refs/tags/v') && env.DOCKERHUB_USERNAME == ''
        run: echo "::warning::DOCKERHUB_USERNAME ou DOCKERHUB_TOKEN non défini, image construite mais non publiée"

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: startsWith(github.ref, 'refs/tags/v') && env.DOCKERHUB_USERNAME != ''
        run: |
          docker tag mmm-project:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/mmm-project:${{ github.ref_name }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mmm-project:${{ github.ref_name }}
